<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="1120" height="780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowred" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f85149"/>
    </marker>
    <marker id="arrowgreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1120" height="780" fill="url(#bg)"/>

  <!-- Title -->
  <text x="560" y="40" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="700">Multi-Tier Enterprise &amp; Security Lab</text>
  <text x="560" y="66" text-anchor="middle" fill="#8b949e" font-size="14">soclab.local · VMware Workstation · OPNsense · Wazuh SIEM</text>

  <!-- Hypervisor box -->
  <rect x="430" y="88" width="260" height="42" rx="6" fill="#1f2937" stroke="#30363d" stroke-width="1.5"/>
  <text x="560" y="108" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="600">HYPERVISOR — VMware Workstation</text>
  <text x="560" y="124" text-anchor="middle" fill="#6e7681" font-size="10">VMnet8 / VMnet10 / VMnet11 / VMnet12 / VMnet13</text>

  <!-- Internet / WAN -->
  <rect x="440" y="150" width="240" height="46" rx="6" fill="#21262d" stroke="#f0883e" stroke-width="1.5"/>
  <text x="560" y="170" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">WAN / Internet</text>
  <text x="560" y="187" text-anchor="middle" fill="#8b949e" font-size="11">VMnet8 (NAT) · valfritt subnät</text>

  <line x1="560" y1="130" x2="560" y2="150" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Firewall -->
  <rect x="410" y="222" width="300" height="76" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="560" y="247" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="700">OPNsense — FW-01</text>
  <text x="560" y="267" text-anchor="middle" fill="#c9d1d9" font-size="11">Router · Brandvägg · DHCP · DNS</text>
  <text x="560" y="284" text-anchor="middle" fill="#8b949e" font-size="10">.10.1 · .20.1 · .30.1 · .40.1</text>

  <line x1="560" y1="196" x2="560" y2="222" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ SEGMENTS ============ -->
  <!-- LAN -->
  <rect x="40" y="360" width="250" height="330" rx="8" fill="#0f1a12" stroke="#3fb950" stroke-width="2"/>
  <text x="165" y="384" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="700">LAN — Corporate</text>
  <text x="165" y="402" text-anchor="middle" fill="#8b949e" font-size="11">192.168.10.0/24 · VMnet10 · Tier 2</text>

  <rect x="58" y="416" width="214" height="58" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="165" y="437" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">DC-01 · .10</text>
  <text x="165" y="453" text-anchor="middle" fill="#8b949e" font-size="10">AD DS · DNS · DHCP</text>
  <text x="165" y="467" text-anchor="middle" fill="#6e7681" font-size="9">Windows Server 2022</text>

  <rect x="58" y="484" width="214" height="58" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="165" y="505" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">FS01 · .11</text>
  <text x="165" y="521" text-anchor="middle" fill="#8b949e" font-size="10">Filserver · AGDLP-demo</text>
  <text x="165" y="535" text-anchor="middle" fill="#6e7681" font-size="9">Windows Server 2022</text>

  <rect x="58" y="552" width="214" height="58" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="165" y="573" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">WIN11-01 · DHCP</text>
  <text x="165" y="589" text-anchor="middle" fill="#8b949e" font-size="10">Klient · GPO-test</text>
  <text x="165" y="603" text-anchor="middle" fill="#6e7681" font-size="9">Windows 11</text>

  <text x="165" y="640" text-anchor="middle" fill="#3fb950" font-size="10" font-style="italic">Wazuh-agent + Sysmon</text>
  <text x="165" y="656" text-anchor="middle" fill="#3fb950" font-size="10" font-style="italic">på samtliga</text>

  <!-- DMZ -->
  <rect x="320" y="360" width="250" height="220" rx="8" fill="#1a1508" stroke="#d29922" stroke-width="2"/>
  <text x="445" y="384" text-anchor="middle" fill="#d29922" font-size="14" font-weight="700">DMZ — Servers</text>
  <text x="445" y="402" text-anchor="middle" fill="#8b949e" font-size="11">192.168.20.0/24 · VMnet11 · Tier 1</text>

  <rect x="338" y="416" width="214" height="58" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="445" y="437" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">LNX-WEB01 · .10</text>
  <text x="445" y="453" text-anchor="middle" fill="#8b949e" font-size="10">Nginx · DVWA</text>
  <text x="445" y="467" text-anchor="middle" fill="#6e7681" font-size="9">Ubuntu Server 24.04</text>

  <rect x="338" y="484" width="214" height="58" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="445" y="505" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">LNX-DB01 · .11</text>
  <text x="445" y="521" text-anchor="middle" fill="#8b949e" font-size="10">MariaDB</text>
  <text x="445" y="535" text-anchor="middle" fill="#6e7681" font-size="9">Ubuntu Server 24.04</text>

  <text x="445" y="562" text-anchor="middle" fill="#d29922" font-size="10" font-style="italic">Härdad SSH · fail2ban · UFW</text>

  <!-- SOC -->
  <rect x="600" y="360" width="250" height="220" rx="8" fill="#0b1622" stroke="#58a6ff" stroke-width="2"/>
  <text x="725" y="384" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">SOC — Management</text>
  <text x="725" y="402" text-anchor="middle" fill="#8b949e" font-size="11">192.168.30.0/24 · VMnet12</text>

  <rect x="618" y="416" width="214" height="86" rx="5" fill="#111d2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="725" y="437" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="700">SOC-WAZUH · .10</text>
  <text x="725" y="453" text-anchor="middle" fill="#8b949e" font-size="10">Wazuh all-in-one</text>
  <text x="725" y="467" text-anchor="middle" fill="#6e7681" font-size="9">Manager + Indexer</text>
  <text x="725" y="481" text-anchor="middle" fill="#6e7681" font-size="9">+ Dashboard</text>
  <text x="725" y="495" text-anchor="middle" fill="#6e7681" font-size="9">Ubuntu 22.04 · 4vCPU/8GB</text>

  <text x="725" y="530" text-anchor="middle" fill="#58a6ff" font-size="10">Portar: 1514 · 1515 · 514 · 55000 · 443</text>
  <text x="725" y="552" text-anchor="middle" fill="#3fb950" font-size="10" font-style="italic">Tar emot ALLA loggar</text>

  <!-- RED -->
  <rect x="880" y="360" width="200" height="220" rx="8" fill="#22100f" stroke="#f85149" stroke-width="2"/>
  <text x="980" y="384" text-anchor="middle" fill="#f85149" font-size="14" font-weight="700">RED — Attack</text>
  <text x="980" y="402" text-anchor="middle" fill="#8b949e" font-size="11">192.168.40.0/24 · VMnet13</text>

  <rect x="898" y="416" width="164" height="70" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="980" y="437" text-anchor="middle" fill="#ffa198" font-size="12" font-weight="700">KALI-01 · .50</text>
  <text x="980" y="453" text-anchor="middle" fill="#8b949e" font-size="10">nmap · hydra</text>
  <text x="980" y="467" text-anchor="middle" fill="#8b949e" font-size="10">impacket · sqlmap</text>
  <text x="980" y="481" text-anchor="middle" fill="#6e7681" font-size="9">Kali Linux 2024</text>

  <text x="980" y="510" text-anchor="middle" fill="#f85149" font-size="10" font-style="italic">Har Wazuh-agent</text>
  <text x="980" y="527" text-anchor="middle" fill="#f85149" font-size="10" font-style="italic">(ser båda sidor)</text>

  <!-- ============ LINES ============ -->
  <!-- FW to LAN -->
  <line x1="500" y1="298" x2="200" y2="358" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <!-- FW to DMZ -->
  <line x1="535" y1="298" x2="450" y2="358" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <!-- FW to SOC -->
  <line x1="585" y1="298" x2="720" y2="358" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <!-- FW to RED -->
  <line x1="640" y1="298" x2="960" y2="358" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowgreen)"/>

  <!-- RED -> DMZ (allowed attack) -->
  <path d="M880 470 L570 470" stroke="#f85149" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#arrowred)"/>
  <text x="712" y="462" text-anchor="middle" fill="#f85149" font-size="11" font-weight="700">ATTACK TILLÅTEN</text>

  <!-- RED -> LAN (blocked) -->
  <path d="M880 500 L300 620" stroke="#f85149" stroke-width="2.5" stroke-dasharray="4,4"/>
  <line x1="560" y1="555" x2="600" y2="585" stroke="#f85149" stroke-width="4"/>
  <line x1="600" y1="555" x2="560" y2="585" stroke="#f85149" stroke-width="4"/>
  <text x="560" y="618" text-anchor="middle" fill="#f85149" font-size="11" font-weight="700">BLOCKERAD (RED → LAN)</text>

  <!-- DMZ -> LAN blocked -->
  <path d="M330 540 L290 600" stroke="#f85149" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="298" y1="566" x2="322" y2="584" stroke="#f85149" stroke-width="3.5"/>
  <line x1="322" y1="566" x2="298" y2="584" stroke="#f85149" stroke-width="3.5"/>

  <!-- Agents -> SOC (green dotted) -->
  <path d="M272 460 Q 560 330 618 440" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="5,3" fill="none" opacity="0.85"/>
  <path d="M554 440 L618 470" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="5,3" fill="none" opacity="0.85"/>
  <path d="M980 500 Q 900 340 838 440" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="5,3" fill="none" opacity="0.85"/>

  <!-- Syslog line -->
  <path d="M512 298 Q 560 330 618 430" stroke="#d29922" stroke-width="1.8" stroke-dasharray="3,3" fill="none"/>
  <text x="470" y="330" fill="#d29922" font-size="10">syslog :514</text>
  <text x="645" y="585" text-anchor="middle" fill="#3fb950" font-size="10" font-style="italic">Agenter :1514/1515</text>

  <!-- Legend -->
  <rect x="40" y="706" width="1040" height="58" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="726" fill="#c9d1d9" font-size="12" font-weight="600">Teckenförklaring:</text>
  <line x1="180" y1="722" x2="215" y2="722" stroke="#3fb950" stroke-width="2.5"/>
  <text x="222" y="726" fill="#8b949e" font-size="11">Tillåten trafik</text>
  <line x1="330" y1="722" x2="365" y2="722" stroke="#f85149" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="372" y="726" fill="#8b949e" font-size="11">Attack / blockerad</text>
  <line x1="520" y1="722" x2="555" y2="722" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="562" y="726" fill="#8b949e" font-size="11">Agent-trafik till SIEM</text>
  <line x1="720" y1="722" x2="755" y2="722" stroke="#d29922" stroke-width="1.8" stroke-dasharray="3,3"/>
  <text x="762" y="726" fill="#8b949e" font-size="11">Syslog</text>
  <text x="60" y="748" fill="#6e7681" font-size="10">Princip: Default-deny + explicita allows + loggning på samtliga regler</text>
  <text x="60" y="760" fill="#6e7681" font-size="10">All loggning → SOC-WAZUH (192.168.30.10) → MITRE ATT&amp;CK-mappade larm</text>
</svg>
